name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name "Die-Reise-zum-Mittelpunkt-der-Erde" --add-data "assets;assets" src\game.py
      - name: Add version file and package
        shell: pwsh
        run: |
          Copy-Item VERSION dist/Die-Reise-zum-Mittelpunkt-der-Erde/VERSION
          Compress-Archive -Path dist/Die-Reise-zum-Mittelpunkt-der-Erde/* -DestinationPath dist/Die-Reise-zum-Mittelpunkt-der-Erde-2.3.1-Windows.zip -Force
      - name: Upload Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: Die-Reise-zum-Mittelpunkt-der-Erde-2.3.1-Windows
          path: dist/Die-Reise-zum-Mittelpunkt-der-Erde-2.3.1-Windows.zip
          if-no-files-found: error
